<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hola Mundo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Poppins", system-ui, sans-serif; }
    canvas { display: block; position: fixed; top: 0; left: 0; }
    .ui-panel {
      position: fixed; top: 1.5rem; left: 1.5rem; z-index: 10;
      width: 200px; padding: 1.25rem; border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(5,8,18,0.72); backdrop-filter: blur(20px);
      display: flex; flex-direction: column; gap: 1rem;
    }
    .back-link {
      display: inline-flex; align-items: center; justify-content: center;
      width: 28px; height: 28px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.45); text-decoration: none; transition: all 0.2s;
    }
    .back-link:hover { color: #fff; border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.06); }
    .panel-title { font-size: 1rem; font-weight: 600; color: #f0f2f8; line-height: 1.3; }
    .panel-title span { color: transparent; -webkit-text-stroke: 1.5px rgba(52,211,153,0.8); }
    .panel-desc { font-size: 0.68rem; font-weight: 300; color: rgba(255,255,255,0.35); line-height: 1.5; margin-top: 0.25rem; }
    .hint-box {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.5rem 0.75rem; border-radius: 10px;
      background: rgba(52,211,153,0.08); border: 1px solid rgba(52,211,153,0.2);
      font-size: 0.72rem; font-weight: 500; color: rgba(52,211,153,0.9);
    }
    .hint-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #34d399; flex-shrink: 0;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.75)} }
  </style>
  <script src="p5 min.js"></script>
</head>
<body>
  <div class="ui-panel">
    <a class="back-link" href="https://mattewrobles.github.io">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </a>
    <div>
      <h1 class="panel-title">Hola<br><span>Mundo</span></h1>
      <p class="panel-desc">El primer proyecto en p5.js — donde todo comenzó.</p>
    </div>
    <div class="hint-box">
      <span class="hint-dot"></span>
      <span>Mueve el mouse</span>
    </div>
  </div>
  <script src="sketch.js"></script>
</body>
</html>
